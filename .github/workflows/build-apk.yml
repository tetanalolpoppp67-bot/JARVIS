name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Распаковать JARVIS
        run: |
          unzip -q JARVIS_GitHub_Actions.zip -d jarvis_project
          cp -r jarvis_project/. .
          rm -rf jarvis_project
          rm -f JARVIS_GitHub_Actions.zip

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
